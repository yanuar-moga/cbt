<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Computer Based Test - Login</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Plus Jakarta Sans untuk presisi tipografi -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        /* Gradient latar belakang biru dengan sudut diagonal panah menjorok ke kanan persis gambar */
        .cbt-left-panel {
            background: linear-gradient(135deg, #0b2da8 0%, #0052cc 50%, #153e90 100%);
            clip-path: polygon(0 0, 100% 0, 84% 50%, 100% 100%, 0 100%);
        }

        @media (max-width: 1024px) {
            .cbt-left-panel {
                clip-path: none;
            }
        }

        /* Warna lemon green aksen */
        .accent-lime {
            background-color: #b8ff00;
        }
        .accent-lime-text {
            color: #b8ff00;
        }
        .accent-lime-border {
            border-color: #b8ff00;
        }
    </style>
</head>
<body class="bg-[#0c1322] min-h-screen flex items-center justify-center p-4 sm:p-6 md:p-10">

    <!-- Kontainer Utama dengan sudut melengkung besar dan border bawah lemon green -->
    <div class="w-full max-w-5xl bg-white rounded-[32px] shadow-[0_25px_60px_-15px_rgba(0,0,0,0.5)] overflow-hidden flex flex-col lg:flex-row relative border-b-4 accent-lime-border min-h-[580px]">
        
        <!-- Sisi Kiri: Panel Biru Diagonal -->
        <div class="lg:w-[48%] cbt-left-panel text-white p-8 lg:p-12 flex flex-col justify-between relative z-10">
            <!-- Header Atas Panel Kiri -->
            <div>
                <p class="text-[11px] font-bold tracking-[0.2em] text-[#b8ff00] uppercase">ASESMEN DIGITAL</p>
                <h1 class="text-2xl lg:text-[28px] font-extrabold tracking-tight mt-1 text-white">Computer Based Test</h1>
                <!-- Garis kecil bawah judul kiri -->
                <div class="w-16 h-[3px] accent-lime mt-1.5 rounded-full"></div>
            </div>

            <!-- Bagian Tengah: Logo Aplikasi & Efek Cahaya / Glow -->
            <div class="my-auto py-10 flex flex-col items-center justify-center relative">
                <!-- Efek cahaya hijau samar di belakang logo -->
                <div class="absolute w-36 h-36 bg-[#b8ff00]/15 rounded-full blur-2xl -z-10"></div>
                
                <!-- Bingkai Logo -->
                <div class="w-32 h-32 lg:w-36 lg:h-36 rounded-2xl p-1 bg-white/10 backdrop-blur-md shadow-2xl flex items-center justify-center border border-white/20 transform hover:scale-105 transition-transform duration-300">
                    <img src="https://yanuar-moga.github.io/assets/logo.jpg" alt="Logo CBT" class="w-full h-full object-cover rounded-xl shadow-inner" onerror="this.src='https://placehold.co/150x150/004085/ffffff?text=CBT'">
                </div>
            </div>

            <!-- Footer Panel Kiri -->
            <div>
                <p class="text-xs text-slate-200 leading-relaxed font-normal">
                    Platform asesmen digital untuk pelaksanaan ujian yang terstruktur, aman, dan mudah digunakan.
                </p>
            </div>
        </div>

        <!-- Sisi Kanan: Form Input Login -->
        <div class="lg:w-[52%] p-8 lg:p-14 flex flex-col justify-center bg-white relative">
            <div class="max-w-md w-full mx-auto">
                
                <!-- Judul Bagian Kanan -->
                <div class="mb-7">
                    <p class="text-[11px] font-bold text-slate-400 tracking-[0.15em] uppercase">ASESMEN DIGITAL • 2026</p>
                    <h2 class="text-2xl lg:text-[26px] font-extrabold text-slate-900 tracking-tight mt-0.5">Computer Based Test</h2>
                    <div class="w-12 h-[3px] accent-lime mt-1.5 rounded-full"></div>
                </div>

                <!-- Form Login -->
                <form action="#" method="POST" class="space-y-4">
                    
                    <!-- Input Username -->
                    <div>
                        <label for="username" class="block text-[11px] font-bold text-slate-700 uppercase tracking-wider mb-1.5">Username</label>
                        <input type="text" id="username" name="username" required 
                            class="w-full px-4 py-3 bg-[#f8fafc] border border-slate-200 rounded-xl text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:bg-white transition-all shadow-sm"
                            placeholder="Masukkan Username">
                    </div>

                    <!-- Input Password -->
                    <div>
                        <label for="password" class="block text-[11px] font-bold text-slate-700 uppercase tracking-wider mb-1.5">Password</label>
                        <input type="password" id="password" name="password" required 
                            class="w-full px-4 py-3 bg-[#f8fafc] border border-slate-200 rounded-xl text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:bg-white transition-all shadow-sm"
                            placeholder="Masukkan Password">
                    </div>

                    <!-- Tombol Masuk -->
                    <div class="pt-3">
                        <button type="submit" 
                            class="w-full py-3.5 px-4 accent-lime hover:opacity-95 font-bold text-slate-900 rounded-xl shadow-[0_4px_14px_rgba(184,251,0,0.4)] transition-all text-center text-sm tracking-wide focus:outline-none focus:ring-4 focus:ring-lime-300/50">
                            Masuk
                        </button>
                    </div>

                </form>

                <!-- Footer Copyright / Versi di Bawah Kanan -->
                <div class="mt-10 text-center">
                    <a href="#about" class="text-xs text-blue-600 font-semibold hover:underline">About CBT Browser v 1.0</a>
                    <p class="text-[11px] text-slate-400 mt-1 font-medium">&copy; 2026 All Rights Reserved</p>
                </div>

            </div>
        </div>

    </div>

</body>
</html>
